<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopkeeper Dashboard</title>
    <style>
        body { font-family: -apple-system, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; }
        .prize { background-color: #d4edda; color: #155724; font-weight: bold; padding: 4px 8px; border-radius: 4px; }
        .header-section { display: flex; justify-content: space-between; align-items: center; }
        .qr-btn { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        #qrModal { display: none; margin-top: 15px; padding: 15px; border: 1px solid #ddd; background: #f8f9fa; text-align: center; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="header-section">
        <h2>Shopkeeper Dashboard</h2>
        <button class="qr-btn" onclick="toggleQRCode()">Show Check-in QR Code</button>
    </div>

    <div id="qrModal">
        <h3>Customer Check-in QR Code</h3>
        <p>Scan this code with a phone camera to open the login page:</p>
        <img id="qrImage" alt="QR Code" style="margin-top: 10px; max-width: 200px;">
    </div>
    
    <table>
        <thead>
            <tr>
                <th>Customer Name</th>
                <th>ID</th>
                <th>Phone</th>
                <th>Purchases</th>
                <th>Prize Status</th>
            </tr>
        </thead>
        <tbody id="customerTableBody">
            <tr><td colspan="5">Loading customers...</td></tr>
        </tbody>
    </table>

    <script>
        function getShopID() {
            const pathParts = window.location.pathname.split('/');
            return pathParts[2]; // /shopkeeper/{shopID}/dashboard
        }

        async function loadDashboard() {
            const shopID = getShopID();

            try {
                const response = await fetch(`/shopkeeper/${shopID}/dashboard/data`);
                const customers = await response.json();
                
                const tbody = document.getElementById('customerTableBody');
                tbody.innerHTML = '';

                if (!customers || customers.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5">No customers found.</td></tr>';
                    return;
                }

                customers.forEach(c => {
                    const row = document.createElement('tr');
                    
                    const prizeHtml = c.rewards > 0 
                        ? `<span class="prize">🎁 ${c.rewards} Available</span>
                           <button onclick="redeemPrize('${c.customer_id}')" style="margin-left:10px; cursor:pointer; background:#28a745; color:white; border:none; padding:5px 10px; border-radius:4px;">Redeem</button>` 
                        : '-';
                    
                    row.innerHTML = `
                        <td>${c.name}</td>
                        <td>${c.unique_id}</td>
                        <td>${c.phone}</td>
                        <td>${c.purchase_count}</td>
                        <td>${prizeHtml}</td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                document.getElementById('customerTableBody').innerHTML = 
                    '<tr><td colspan="5" style="color:red;">Error loading data.</td></tr>';
            }
        }

        async function redeemPrize(customerID) {
            if (!confirm("Mark one prize as claimed for this customer?")) return;
            
            const shopID = getShopID();
            
            try {
                const response = await fetch(`/shopkeeper/${shopID}/redeem/${customerID}`, { method: 'POST' });
                if (response.ok) {
                    loadDashboard();
                } else {
                    const errText = await response.text();
                    alert("Failed to redeem: " + errText);
                }
            } catch (error) {
                alert("Network error.");
            }
        }

        function toggleQRCode() {
            const modal = document.getElementById('qrModal');
            const img = document.getElementById('qrImage');
            
            if (modal.style.display === 'block') {
                modal.style.display = 'none';
            } else {
                const shopID = getShopID();
                img.src = `/shopkeeper/${shopID}/qr`;
                modal.style.display = 'block';
            }
        }

        loadDashboard();
    </script>
</body>
</html>
