<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Check-in</title>
    <style>
        body { font-family: -apple-system, sans-serif; max-width: 400px; margin: 40px auto; padding: 20px; text-align: center; }
        input, button { width: 100%; margin-bottom: 15px; padding: 12px; box-sizing: border-box; font-size: 16px; }
        button { background: #000; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;}
        #result { margin-top: 20px; padding: 20px; border-radius: 6px; display: none; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <h2>Welcome!</h2>
    <p>Enter your details to check in.</p>

    <form id="loginForm">
        <input type="text" id="name" placeholder="Your Name" required>
        <input type="tel" id="phone" placeholder="Phone Number" required>
        <button type="submit">Check In</button>
    </form>

    <div id="result"></div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            // Extract the shopID from the URL path (e.g., /c/1111-2222...)
            const shopID = window.location.pathname.split('/').pop();
            const btn = e.target.querySelector('button');
            const resultDiv = document.getElementById('result');
            
            btn.disabled = true;
            btn.innerText = 'Checking in...';
            
            try {
                const response = await fetch(`/c/${shopID}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: document.getElementById('name').value,
                        phone: document.getElementById('phone').value
                    })
                });
                
                const data = await response.json();
                
                resultDiv.style.display = 'block';
                if (response.ok) {
                    resultDiv.className = 'success';
                    resultDiv.innerHTML = `
                        <h3>${data.message}</h3>
                        Customer ID: <strong>${data.customer_id}</strong><br>
                        Total Purchases: <strong>${data.purchase_count}</strong><br>
                        Available Rewards: <strong>${data.rewards}</strong>
                    `;
                    e.target.style.display = 'none';
                } else {
                    resultDiv.className = 'error';
                    resultDiv.innerText = data.message || 'An error occurred';
                    btn.disabled = false;
                    btn.innerText = 'Check In';
                }
            } catch (err) {
                resultDiv.className = 'error';
                resultDiv.innerText = 'Failed to connect to server';
                btn.disabled = false;
                btn.innerText = 'Check In';
            }
        });
    </script>
</body>
</html>
